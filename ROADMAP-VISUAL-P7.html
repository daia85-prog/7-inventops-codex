<!DOCTYPE html>

<style>

<body>

  <text x="1280" y="838" text-anchor="middle" fill="#f5c300" font-size="14" font-weight="600" letter-spacing="1">✦ Desenvolvido por Daiana Costa · InventOps · 12/07/2026</text>
